<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Container</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f0f0f;
      color: #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 2rem 2.5rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .dot {
      width: 10px;
      height: 10px;
      background: #22c55e;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 0.5rem; }
    p { font-size: 0.9rem; color: #888; margin-top: 0.5rem; }
    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 4px 10px;
      color: #666;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="dot"></span>
    <h1>Container is running</h1>
    <p>Serving on port 8080 via Python http.server</p>
    <div class="badge">docker run -p 8080:8080 &lt;image&gt;</div>
  </div>
</body>
</html>
